# Renders the website and publishes it to the gh-pages branch, which GitHub
# Pages serves. Runs on every push to main, or by hand from the Actions tab.
# On a pull request it only renders, as a check that every page still builds.
# Based on the publish.yml in Cryptococcus-cost-analysis.
#
# The only R these pages run is the hidden knitr::read_chunk() import on each
# code page, which reads the scripts as text. Nothing reads data
# (AGENTS.md, "Quarto website"), and this machine has no study data. A failed
# render publishes nothing, so the last good site stays live.

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Publish website

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # So R reads and writes non-ASCII characters (such as ≥) as UTF-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Quarto must be set up before R.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so a new Quarto release can't change the site unseen; to
          # move to a newer version, change this line in a pull request.
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only what the pages run: knitr and rmarkdown for the import chunks.
      - name: Install the R packages the pages use
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render (pull requests only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
