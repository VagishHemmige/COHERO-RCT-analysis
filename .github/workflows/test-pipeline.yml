# Runs the whole analysis on synthetic data on every pull request and push
# to main, or by hand from the Actions tab, and fails if main.R errors or an
# expected output is missing. The runner has no study data: everything it
# reads is built by tests/synthetic/build_synthetic_data.R. The log shows
# only pass or fail per check and a count of warnings by message; no outputs
# are uploaded.

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Test pipeline on synthetic data

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The packages R/setup.R attaches, plus writexl for the synthetic files
      - name: Install the R packages the analysis uses
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::writexl
            any::ggbeeswarm
            any::plotly
            any::broom
            any::broom.mixed
            any::lme4
            any::lmerTest
            any::gganimate
            any::flextable
            any::gtsummary
            any::patchwork

      - name: Run the analysis on synthetic data
        run: Rscript tests/synthetic/run_pipeline.R
