# Runs the whole analysis on synthetic data on every pull request and push
# to main, or by hand from the Actions tab, and fails if main.R errors, an
# expected output is missing, a model has too little data, or a known effect
# is not recovered. On a pull request it also runs main's code with the same
# harness and synthetic data, and reports which outputs differ; that report
# never fails the run. The runner has no study data: everything it reads is
# built by tests/synthetic/build_synthetic_data.R. The log shows check
# results, counts of warnings and messages, and estimates on synthetic data
# only; no outputs are uploaded.

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Test pipeline on synthetic data

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The packages R/setup.R attaches, plus writexl for the synthetic files
      # and broom.helpers, which gtsummary's tbl_regression() needs but only
      # suggests. Quarto is not installed: this job renders nothing.
      - name: Install the R packages the analysis uses
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          packages: |
            any::tidyverse
            any::readxl
            any::writexl
            any::ggbeeswarm
            any::plotly
            any::broom
            any::broom.mixed
            any::lme4
            any::lmerTest
            any::gganimate
            any::flextable
            any::gtsummary
            any::broom.helpers
            any::patchwork

      - name: Run the analysis on synthetic data
        env:
          COHERO_SNAPSHOT: ${{ runner.temp }}/proposed.rds
        run: Rscript tests/synthetic/run_pipeline.R

      # Pull requests only: main's R/ with this branch's harness and data
      - name: Check out main for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Run main's code on the same synthetic data
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: base
        env:
          COHERO_SNAPSHOT: ${{ runner.temp }}/base.rds
        run: Rscript ../tests/synthetic/run_pipeline.R

      - name: Report which outputs differ from main
        if: github.event_name == 'pull_request'
        run: >
          Rscript tests/synthetic/compare_snapshots.R
          "${{ runner.temp }}/base.rds" "${{ runner.temp }}/proposed.rds"
